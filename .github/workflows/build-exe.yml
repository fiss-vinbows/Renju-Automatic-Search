name: Build RAS.exe

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install PyInstaller
        run: python -m pip install pyinstaller
      - name: Build
        shell: cmd
        run: build.bat
      - name: Package
        shell: pwsh
        run: Compress-Archive -Path dist\RAS -DestinationPath RAS.zip
      - uses: actions/upload-artifact@v4
        with:
          name: RAS
          path: dist/RAS
      - name: Publish release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: RAS.zip
